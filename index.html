<body style="margin:0;overflow:hidden">
<canvas id="c"></canvas>
<script>
    const ctx = c.getContext('2d');
    c.width = innerWidth; 
    c.height = innerHeight;
    var tilesize = 60;
    var numTilesX = 10;
    var numTilesY = 10;
    var dir = 0; //0 = right, 90 = down, 180 = left, 270 = up
    var actualDir = 0;
    var snake = [[0,0],[1,0],[2,0]];
    var apple = randomFreeTile();
    var extend = false;
    var gameOver = true;
    var startScreen = true;

    ctx.font = '100px monospace';

    onresize = () => {c.width = innerWidth; c.height = innerHeight;};
    onclick = () => console.log('clicked');
    onkeydown = keydown;

    ctx.strokeStyle = 'black';
    ctx.lineWidth = 3;

    setInterval(updateSnake, 200);

    let last = performance.now();
    function loop(now) {
        const dt = Math.min((now - last) / (1000 / 60), 3);
        last = now;
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, c.width, c.height);

        var gridWidth = numTilesX * tilesize;
        var gridHeight = numTilesY * tilesize;

        var startX = c.width/2 - gridWidth/2;
        var startY = c.height/2 - gridHeight/2;

        drawRect('grey', startX, startY, gridWidth, gridHeight, 'rbtl');
        for (let i = 0; i < snake.length; i++){
            let pos = snake[i];
            let lastDir = [2,2];
            let nextDir = [2,2];
            if (i != 0){
                let lastPos = snake[i-1];
                lastDir = [lastPos[0] - pos[0], lastPos[1] - pos[1]];
            }  
            if (i != snake.length-1){
                let nextPos = snake[i+1]
                nextDir = [nextPos[0] - pos[0], nextPos[1] - pos[1]];
            }

            let removeSide = '';
            if (lastDir[0] != 2){
                if (lastDir[0] == 0 && lastDir[1] == 1){
                    removeSide = removeSide + 'b';
                }
                if (lastDir[0] == 0 && lastDir[1] == -1){
                    removeSide = removeSide + 't';
                }
                if (lastDir[0] == 1 && lastDir[1] == 0){
                    removeSide = removeSide + 'r';
                }
                if (lastDir[0] == -1 && lastDir[1] == 0){
                    removeSide = removeSide + 'l';
                }
            }
            if (nextDir[0] != 2){
                if (nextDir[0] == 0 && nextDir[1] == 1){
                    removeSide = removeSide + 'b';
                }
                if (nextDir[0] == 0 && nextDir[1] == -1){
                    removeSide = removeSide + 't';
                }
                if (nextDir[0] == 1 && nextDir[1] == 0){
                    removeSide = removeSide + 'r';
                }
                if (nextDir[0] == -1 && nextDir[1] == 0){
                    removeSide = removeSide + 'l';
                }
            }

            let drawX = startX + (pos[0] * tilesize);
            let drawY = startY + (pos[1] * tilesize);
            var color = 'lime';
            if (i == (snake.length-1)){
                color = 'darkgreen';
                if (gameOver && !startScreen){
                    color = 'red';
                }
            }

            let edges = ''
            drawRect(color, drawX, drawY, tilesize, tilesize, oppositeSides(removeSide));
            if (i == (snake.length-1)){
                if (actualDir == 0){ //right
                    drawRect('black', drawX + 40, drawY + 10, 10, 10);
                    drawRect('black', drawX + 40, drawY + 40, 10, 10);
                }else if (actualDir == 90){ //down
                    drawRect('black', drawX + 10, drawY + 40, 10, 10);
                    drawRect('black', drawX + 40, drawY + 40, 10, 10);
                }else if (actualDir == 180){ //left
                    drawRect('black', drawX + 10, drawY + 10, 10, 10);
                    drawRect('black', drawX + 10, drawY + 40, 10, 10);
                }else if (actualDir == 270){ //up
                    drawRect('black', drawX + 10, drawY + 10, 10, 10);
                    drawRect('black', drawX + 40, drawY + 10, 10, 10);
                }
            }
        }
        drawRect('red', startX + (apple[0] * tilesize), startY + (apple[1] * tilesize), tilesize, tilesize, 'tblr');

        if (!gameOver){
            ctx.fillStyle = 'black';
            const text = String(snake.length-3);
            const textWidth = ctx.measureText(text).width;
            ctx.fillText(text, c.width/2 - textWidth/2, c.height/2 - 320);
        }else if (!startScreen){
            ctx.fillStyle = 'darkred';
            ctx.fillText("GAME OVER", c.width/2 - 275, c.height/2 - 320);

            const text = "Score: " + String(snake.length-3);
            const textWidth = ctx.measureText(text).width;

            ctx.fillText(text, c.width/2 - textWidth/2, c.height/2 - 90);
            ctx.fillText("press anything", c.width/2 - 400, c.height/2 + 20);
            ctx.fillText("to restart", c.width/2 - 300, c.height/2 + 130);
        }else{
            ctx.fillStyle = 'black';
            ctx.fillText("press anything", c.width/2 - 430, c.height/2 - 20);
            ctx.fillText("to start", c.width/2 - 250, c.height/2 + 90);
        }
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function oppositeSides(sides) {
        return "tblr".split("").filter(side => !sides.includes(side)).join("");
    }

    function updateSnake(){
        if (gameOver){
            return;
        }
        let change = [0,0];
        if (dir == 0){
            change[0] = 1;
        }
        if (dir == 90){
            change[1] = 1;
        }
        if (dir == 180){
            change[0] = -1;
        }
        if (dir == 270){
            change[1] = -1;
        }
        actualDir = dir;
        let currentPos = snake.at(-1);
        let newPos = [currentPos[0]+change[0],currentPos[1]+change[1]];

        let ate = false;
        if (!extend){
            snake.shift();
        }else{
            extend = false;
        }
        if (newPos[0] == apple[0] && newPos[1] == apple[1]){
            extend = true;
            ate = true;
        }
        if (snakeContains(newPos[0], newPos[1])){
            gameOver = true;
            snake.push(newPos);
            return;
        }
        if (newPos[0] < 0 || newPos[0] > numTilesX-1 || newPos[1] < 0 || newPos[1] > numTilesY-1){
            gameOver = true;
            snake.push(newPos);
            return;
        }
        snake.push(newPos);
        if (ate) {
            apple = randomFreeTile();
        }
    }

    function randomFreeTile() {
        while (true) {
            const x = Math.floor(Math.random() * numTilesX);
            const y = Math.floor(Math.random() * numTilesY);

            const occupied = snake.some(([cx, cy]) => cx === x && cy === y);

            if (!occupied) {
            return [x, y];
            }
        }
    }

    function randint(min, max) {return Math.floor(Math.random() * (max - min + 1)) + min;}

    function snakeContains(x, y) {return snake.some(pos => pos[0] === x && pos[1] === y)}

    function keydown(e){
        let key = e.key
        let angle = 0
        if (key == "a" || key == "LeftArrow"){
            angle = 180;
        } 
        if (key == "w" || key == "UpArrow"){
            angle = 270
        }
        if (key == "d" || key == "RightArrow"){
            angle = 0
        }
        if (key == "s" || key == "DownArrow"){
            angle = 90
        }
        if (((angle + 180) % 360) != actualDir){
            dir = angle;
        }
        if (startScreen){
            startScreen = false;
            gameOver = false;
            dir = 0;
            actualDir = 0;
        }
        if (gameOver){
            startScreen = true;
            snake = [[0,0],[1,0],[2,0]];
            apple = randomFreeTile();
            dir = 0;
            actualDir = 0;
        }
    }

    function drawRect(color, x, y, width, height, sides="") {
        ctx.fillStyle = color;
        ctx.fillRect(x, y, width, height);

        ctx.beginPath();
        if (sides.includes("t")) {
            ctx.moveTo(x, y);
            ctx.lineTo(x + width, y);
        }
        if (sides.includes("r")) {
            ctx.moveTo(x + width, y);
            ctx.lineTo(x + width, y + height);
        }
        if (sides.includes("b")) {
            ctx.moveTo(x + width, y + height);
            ctx.lineTo(x, y + height);
        }
        if (sides.includes("l")) {
            ctx.moveTo(x, y + height);
            ctx.lineTo(x, y);
        }
        ctx.stroke();
    }
</script>
