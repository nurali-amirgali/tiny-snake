<body style="margin:0;overflow:hidden">
<canvas id="c"></canvas>
<script>
    const ctx = c.getContext('2d');
    c.width = innerWidth; 
    c.height = innerHeight;
    var tilesize = 60;
    var numTilesX = 10;
    var numTilesY = 10;
    var dir = 0; //0 = right, 90 = down, 180 = left, 270 = up
    var actualDir = 0;
    var snake = [[0,0],[1,0],[2,0]];
    var apple = randomFreeTile();
    var extend = false;
    var gameOver = false;

    onresize = () => {c.width = innerWidth; c.height = innerHeight;};
    onclick = () => console.log('clicked');
    onkeydown = keydown;

    ctx.strokeStyle = 'black';
    ctx.lineWidth = 2;

    setInterval(updateSnake, 200);

    let last = performance.now();
    function loop(now) {
        const dt = Math.min((now - last) / (1000 / 60), 3);
        last = now;
        ctx.fillStyle = 'white';
        ctx.fillRect(0, 0, c.width, c.height);

        var gridWidth = numTilesX * tilesize;
        var gridHeight = numTilesY * tilesize;

        for (let row = 0; row < numTilesY; row++) {
            for (let col = 0; col < numTilesX; col++) {
                var color = (snakeContains(col, row)) ? 'lime' : 'grey';
                if (apple[0] == col && apple[1] == row){
                    color = 'red';
                }
                let currentPos = snake.at(-1);
                if (currentPos[0] == col && currentPos[1] == row){
                    color = 'darkgreen';
                }
                var drawX = col * tilesize + (c.width/2) - (gridWidth/2);
                var drawY = row * tilesize + (c.height/2) - (gridHeight/2);
                drawRect(color, drawX, drawY, tilesize, tilesize)
            }
        }
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function updateSnake(){
        if (gameOver){
            return;
        }
        let change = [0,0];
        if (dir == 0){
            change[0] = 1;
        }
        if (dir == 90){
            change[1] = 1;
        }
        if (dir == 180){
            change[0] = -1;
        }
        if (dir == 270){
            change[1] = -1;
        }
        actualDir = dir;
        let currentPos = snake.at(-1);
        let newPos = [currentPos[0]+change[0],currentPos[1]+change[1]];
        if (snakeContains(newPos[0], newPos[1])){
            gameOver = true;
            return;
        }
        snake.push(newPos);
        if (!extend){
            snake.shift();
        }else{
            extend = false;
        }
        if (newPos[0] == apple[0] && newPos[1] == apple[1]){
            extend = true;
            apple = randomFreeTile();
        }
    }

    function randomFreeTile() {
        while (true) {
            const x = Math.floor(Math.random() * numTilesX);
            const y = Math.floor(Math.random() * numTilesY);

            const occupied = snake.some(([cx, cy]) => cx === x && cy === y);

            if (!occupied) {
            return [x, y];
            }
        }
    }

    function randint(min, max) {return Math.floor(Math.random() * (max - min + 1)) + min;}

    function snakeContains(x, y) {return snake.some(pos => pos[0] === x && pos[1] === y)}

    function keydown(e){
        let key = e.key
        let angle = 0
        if (key == "a" || key == "LeftArrow"){
            angle = 180;
        } 
        if (key == "w" || key == "UpArrow"){
            angle = 270
        }
        if (key == "d" || key == "RightArrow"){
            angle = 0
        }
        if (key == "s" || key == "DownArrow"){
            angle = 90
        }
        if (((angle + 180) % 360) != actualDir){
            dir = angle;
        }
    }

    function drawRect(color, x, y, width, height){
        ctx.fillStyle = color;
        ctx.fillRect(x,y,width,height);
        ctx.strokeRect(x,y,width,height);
    }
</script>
